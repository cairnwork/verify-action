name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout verify-action
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Checkout demo-target
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: cairnwork/demo-target
          ref: '7cd79ab8ac46ed466a345fa6e4de315e20f6f78d'
          fetch-depth: 0
          path: target

      - name: Positive verification
        id: test_positive
        uses: ./
        with:
          bundle-path: ${{ github.workspace }}/fixtures/demo-target-pr4/bundle.json
          public-key: ${{ github.workspace }}/fixtures/demo-target-pr4/public-key.pem
          candidate: '7cd79ab8ac46ed466a345fa6e4de315e20f6f78d'
          base: '0c484d9eaeb7afdb29d542c09094770ed6f728e6'
          repo-path: target
          require-when: always
          cairnwork-ref: '5819a8c56e19fb32d597f8213a9961f46c3307d4'

      - name: Assert positive verification
        run: |
          test "${{ steps.test_positive.outputs.verdict }}" = "VERIFIED"
          test "${{ steps.test_positive.outputs.code }}" = "OK"
          expected_sha=$(jq -r .payload "$GITHUB_WORKSPACE/fixtures/demo-target-pr4/bundle.json" | base64 -d | sha256sum | awk '{print $1}')
          test "${{ steps.test_positive.outputs.statement-sha256 }}" = "$expected_sha"

      - name: Negative candidate verification
        id: test_negative_candidate
        uses: ./
        continue-on-error: true
        with:
          bundle-path: ${{ github.workspace }}/fixtures/demo-target-pr4/bundle.json
          public-key: ${{ github.workspace }}/fixtures/demo-target-pr4/public-key.pem
          candidate: '0c484d9eaeb7afdb29d542c09094770ed6f728e6'
          base: '0c484d9eaeb7afdb29d542c09094770ed6f728e6'
          repo-path: target
          require-when: always
          cairnwork-ref: '5819a8c56e19fb32d597f8213a9961f46c3307d4'

      - name: Assert negative candidate verification
        run: |
          test "${{ steps.test_negative_candidate.outcome }}" = "failure"
          test "${{ steps.test_negative_candidate.outputs.code }}" = "CANDIDATE_MISMATCH"

      - name: Base check verification
        id: test_base_check
        uses: ./
        continue-on-error: true
        with:
          bundle-path: ${{ github.workspace }}/fixtures/demo-target-pr4/bundle.json
          public-key: ${{ github.workspace }}/fixtures/demo-target-pr4/public-key.pem
          candidate: '7cd79ab8ac46ed466a345fa6e4de315e20f6f78d'
          base: '0000000000000000000000000000000000000001'
          repo-path: target
          require-when: always
          cairnwork-ref: '5819a8c56e19fb32d597f8213a9961f46c3307d4'

      - name: Assert base check verification
        run: |
          test "${{ steps.test_base_check.outcome }}" = "failure"
          test "${{ steps.test_base_check.outputs.code }}" = "BASE_NOT_IN_TARGET"

      - name: Build bundles with unsupported versions
        run: |
          fx="$GITHUB_WORKSPACE/fixtures/demo-target-pr4/bundle.json"
          mk() {
            p=$(jq -r .payload "$fx" | base64 -d | jq -c "$1" | base64 -w0)
            jq --arg p "$p" '.payload = $p' "$fx" > "$RUNNER_TEMP/$2.json"
          }
          mk '.predicateType = "https://cairnwork.github.io/attestation/verified-change/v0.2"' newer-predicate
          mk '._type = "https://in-toto.io/Statement/v0.1"' old-statement
          # line breaks, spaces, non-ASCII and over 200 characters: exercises the cleaning and the cap
          mk '.predicateType = ("https://evil.example/a b\n\r%0A::error::x é" + ("z" * 300))' messy-predicate
          # correctly signed bundles under a throwaway key: v0.1 must verify, v0.2 must still be refused
          openssl genpkey -algorithm ed25519 -out "$RUNNER_TEMP/test-key.pem"
          openssl pkey -in "$RUNNER_TEMP/test-key.pem" -pubout -out "$RUNNER_TEMP/test-pub.pem"
          scripts/test-resign.sh "$fx" '.' "$RUNNER_TEMP/signed-v01.json" "$RUNNER_TEMP/test-key.pem"
          scripts/test-resign.sh "$fx" '.predicateType = "https://cairnwork.github.io/attestation/verified-change/v0.2"' \
            "$RUNNER_TEMP/signed-v02.json" "$RUNNER_TEMP/test-key.pem"

      - name: Newer predicate version
        id: test_newer_predicate
        uses: ./
        continue-on-error: true
        with:
          bundle-path: ${{ runner.temp }}/newer-predicate.json
          public-key: ${{ github.workspace }}/fixtures/demo-target-pr4/public-key.pem
          candidate: '7cd79ab8ac46ed466a345fa6e4de315e20f6f78d'
          base: '0c484d9eaeb7afdb29d542c09094770ed6f728e6'
          repo-path: target
          require-when: always
          cairnwork-ref: '5819a8c56e19fb32d597f8213a9961f46c3307d4'

      - name: Old statement type
        id: test_old_statement
        uses: ./
        continue-on-error: true
        with:
          bundle-path: ${{ runner.temp }}/old-statement.json
          public-key: ${{ github.workspace }}/fixtures/demo-target-pr4/public-key.pem
          candidate: '7cd79ab8ac46ed466a345fa6e4de315e20f6f78d'
          base: '0c484d9eaeb7afdb29d542c09094770ed6f728e6'
          repo-path: target
          require-when: always
          cairnwork-ref: '5819a8c56e19fb32d597f8213a9961f46c3307d4'

      - name: Messy predicate version
        id: test_messy_predicate
        uses: ./
        continue-on-error: true
        with:
          bundle-path: ${{ runner.temp }}/messy-predicate.json
          public-key: ${{ github.workspace }}/fixtures/demo-target-pr4/public-key.pem
          candidate: '7cd79ab8ac46ed466a345fa6e4de315e20f6f78d'
          base: '0c484d9eaeb7afdb29d542c09094770ed6f728e6'
          repo-path: target
          require-when: always
          cairnwork-ref: '5819a8c56e19fb32d597f8213a9961f46c3307d4'

      - name: Signed current version under a test key
        id: test_signed_v01
        uses: ./
        continue-on-error: true
        with:
          bundle-path: ${{ runner.temp }}/signed-v01.json
          public-key: ${{ runner.temp }}/test-pub.pem
          candidate: '7cd79ab8ac46ed466a345fa6e4de315e20f6f78d'
          base: '0c484d9eaeb7afdb29d542c09094770ed6f728e6'
          repo-path: target
          require-when: always
          cairnwork-ref: '5819a8c56e19fb32d597f8213a9961f46c3307d4'

      - name: Signed newer version under a test key
        id: test_signed_v02
        uses: ./
        continue-on-error: true
        with:
          bundle-path: ${{ runner.temp }}/signed-v02.json
          public-key: ${{ runner.temp }}/test-pub.pem
          candidate: '7cd79ab8ac46ed466a345fa6e4de315e20f6f78d'
          base: '0c484d9eaeb7afdb29d542c09094770ed6f728e6'
          repo-path: target
          require-when: always
          cairnwork-ref: '5819a8c56e19fb32d597f8213a9961f46c3307d4'

      - name: Assert unsupported versions are rejected
        run: |
          test "${{ steps.test_newer_predicate.outcome }}" = "failure"
          test "${{ steps.test_newer_predicate.outputs.code }}" = "UNSUPPORTED_PREDICATE_TYPE"
          test -z "${{ steps.test_newer_predicate.outputs.predicate-type }}"
          test "${{ steps.test_old_statement.outcome }}" = "failure"
          test "${{ steps.test_old_statement.outputs.code }}" = "UNSUPPORTED_PREDICATE_TYPE"
          test -z "${{ steps.test_old_statement.outputs.predicate-type }}"
          test "${{ steps.test_positive.outputs.predicate-type }}" = "https://cairnwork.github.io/attestation/verified-change/v0.1"
          test "${{ steps.test_newer_predicate.outputs.verdict }}" = "REJECTED"
          test "${{ steps.test_old_statement.outputs.verdict }}" = "REJECTED"
          test "${{ steps.test_messy_predicate.outcome }}" = "failure"
          test "${{ steps.test_messy_predicate.outputs.verdict }}" = "REJECTED"
          test "${{ steps.test_messy_predicate.outputs.code }}" = "UNSUPPORTED_PREDICATE_TYPE"
          test -z "${{ steps.test_messy_predicate.outputs.predicate-type }}"
          # the re-signing is sound: the same key and method verify an unchanged v0.1 statement
          test "${{ steps.test_signed_v01.outcome }}" = "success"
          test "${{ steps.test_signed_v01.outputs.verdict }}" = "VERIFIED"
          # so a validly signed v0.2 is refused for its version, not its signature
          test "${{ steps.test_signed_v02.outcome }}" = "failure"
          test "${{ steps.test_signed_v02.outputs.verdict }}" = "REJECTED"
          test "${{ steps.test_signed_v02.outputs.code }}" = "UNSUPPORTED_PREDICATE_TYPE"

      - name: Skip path verification
        id: test_skip_path
        uses: ./
        with:
          public-key: ${{ github.workspace }}/fixtures/demo-target-pr4/public-key.pem
          candidate: '7cd79ab8ac46ed466a345fa6e4de315e20f6f78d'
          base: '0c484d9eaeb7afdb29d542c09094770ed6f728e6'
          repo-path: target
          fetch-notes: 'false'
          require-when: 'label:cairnwork'
          pr-labels: '[]'
          cairnwork-ref: '5819a8c56e19fb32d597f8213a9961f46c3307d4'

      - name: Assert skip path verification
        run: |
          test "${{ steps.test_skip_path.outcome }}" = "success"
          test "${{ steps.test_skip_path.outputs.verdict }}" = "SKIPPED"
          test "${{ steps.test_skip_path.outputs.code }}" = "BUNDLE_MISSING"

      - name: Add git note to target repo
        run: |
          cd target
          git -c user.name=test -c user.email=test@example.invalid \
            notes --ref refs/notes/cairnwork add -F "$GITHUB_WORKSPACE/fixtures/demo-target-pr4/bundle.json" 7cd79ab8ac46ed466a345fa6e4de315e20f6f78d

      - name: Notes path verification
        id: test_notes_path
        uses: ./
        with:
          public-key: ${{ github.workspace }}/fixtures/demo-target-pr4/public-key.pem
          candidate: '7cd79ab8ac46ed466a345fa6e4de315e20f6f78d'
          base: '0c484d9eaeb7afdb29d542c09094770ed6f728e6'
          repo-path: target
          fetch-notes: 'false'
          require-when: always
          cairnwork-ref: '5819a8c56e19fb32d597f8213a9961f46c3307d4'

      - name: Assert notes path verification
        run: |
          test "${{ steps.test_notes_path.outcome }}" = "success"
          test "${{ steps.test_notes_path.outputs.verdict }}" = "VERIFIED"
          test "${{ steps.test_notes_path.outputs.code }}" = "OK"

      # Notes fetch failure relies on cairnwork/demo-target having no refs/notes/cairnwork.
      - name: Clean up local note before notes fetch failure test
        run: |
          cd target
          git -c user.name=test -c user.email=test@example.invalid \
            notes --ref refs/notes/cairnwork remove 7cd79ab8ac46ed466a345fa6e4de315e20f6f78d
          # the later cases rely on no note being present
          if git notes --ref refs/notes/cairnwork show 7cd79ab8ac46ed466a345fa6e4de315e20f6f78d >/dev/null 2>&1; then
            echo "note still present"; exit 1
          fi

      - name: Notes fetch failure verification
        id: test_notes_fetch_failure
        uses: ./
        continue-on-error: true
        with:
          public-key: ${{ github.workspace }}/fixtures/demo-target-pr4/public-key.pem
          candidate: '7cd79ab8ac46ed466a345fa6e4de315e20f6f78d'
          base: '0c484d9eaeb7afdb29d542c09094770ed6f728e6'
          repo-path: target
          fetch-notes: 'true'
          require-when: always
          cairnwork-ref: '5819a8c56e19fb32d597f8213a9961f46c3307d4'

      - name: Assert notes fetch failure
        run: |
          test "${{ steps.test_notes_fetch_failure.outcome }}" = "failure"
          test "${{ steps.test_notes_fetch_failure.outputs.code }}" = "NOTES_FETCH_FAILED"

      - name: Generate wrong key
        run: |
          openssl genpkey -algorithm ed25519 -out "$RUNNER_TEMP/other.pem"
          openssl pkey -in "$RUNNER_TEMP/other.pem" -pubout -out "$RUNNER_TEMP/other.pub.pem"

      - name: Wrong key verification
        id: test_wrong_key
        uses: ./
        continue-on-error: true
        with:
          bundle-path: ${{ github.workspace }}/fixtures/demo-target-pr4/bundle.json
          public-key: ${{ runner.temp }}/other.pub.pem
          candidate: '7cd79ab8ac46ed466a345fa6e4de315e20f6f78d'
          base: '0c484d9eaeb7afdb29d542c09094770ed6f728e6'
          repo-path: target
          require-when: always
          cairnwork-ref: '5819a8c56e19fb32d597f8213a9961f46c3307d4'

      - name: Assert wrong key verification
        run: |
          test "${{ steps.test_wrong_key.outcome }}" = "failure"
          test "${{ steps.test_wrong_key.outputs.code }}" = "SIGNATURE_INVALID"

      - name: Prepare multi-key PEM
        id: prepare_multi_key
        run: |
          {
            echo "pems<<EOF"
            cat "$RUNNER_TEMP/other.pub.pem"
            echo ""
            cat "$GITHUB_WORKSPACE/fixtures/demo-target-pr4/public-key.pem"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Multi-key verification
        id: test_multi_key
        uses: ./
        with:
          bundle-path: ${{ github.workspace }}/fixtures/demo-target-pr4/bundle.json
          public-key: ${{ steps.prepare_multi_key.outputs.pems }}
          candidate: '7cd79ab8ac46ed466a345fa6e4de315e20f6f78d'
          base: '0c484d9eaeb7afdb29d542c09094770ed6f728e6'
          repo-path: target
          require-when: always
          cairnwork-ref: '5819a8c56e19fb32d597f8213a9961f46c3307d4'

      - name: Assert multi-key verification
        run: |
          test "${{ steps.test_multi_key.outcome }}" = "success"
          test "${{ steps.test_multi_key.outputs.verdict }}" = "VERIFIED"
          test "${{ steps.test_multi_key.outputs.code }}" = "OK"

      - name: Create malformed bundle
        run: |
          echo '{"payload":"!!!","payloadType":"x","signatures":[]}' > "$RUNNER_TEMP/bad.json"

      - name: Malformed bundle verification
        id: test_malformed_bundle
        uses: ./
        continue-on-error: true
        with:
          bundle-path: ${{ runner.temp }}/bad.json
          public-key: ${{ github.workspace }}/fixtures/demo-target-pr4/public-key.pem
          candidate: '7cd79ab8ac46ed466a345fa6e4de315e20f6f78d'
          base: '0c484d9eaeb7afdb29d542c09094770ed6f728e6'
          repo-path: target
          require-when: always
          cairnwork-ref: '5819a8c56e19fb32d597f8213a9961f46c3307d4'

      - name: Assert malformed bundle verification
        run: |
          test "${{ steps.test_malformed_bundle.outcome }}" = "failure"
          test "${{ steps.test_malformed_bundle.outputs.code }}" = "BUNDLE_MALFORMED"

      - name: Label present requires bundle verification
        id: test_label_requires_bundle
        uses: ./
        continue-on-error: true
        with:
          public-key: ${{ github.workspace }}/fixtures/demo-target-pr4/public-key.pem
          candidate: '7cd79ab8ac46ed466a345fa6e4de315e20f6f78d'
          base: '0c484d9eaeb7afdb29d542c09094770ed6f728e6'
          repo-path: target
          fetch-notes: 'false'
          require-when: 'label:cairnwork'
          pr-labels: '["cairnwork"]'
          cairnwork-ref: '5819a8c56e19fb32d597f8213a9961f46c3307d4'

      - name: Assert label requires bundle verification
        run: |
          test "${{ steps.test_label_requires_bundle.outcome }}" = "failure"
          test "${{ steps.test_label_requires_bundle.outputs.verdict }}" = "REJECTED"
          test "${{ steps.test_label_requires_bundle.outputs.code }}" = "BUNDLE_MISSING"

      - name: Prepare keyid injection bundle
        run: |
          jq '.signatures[0].keyid = "k\nverdict=VERIFIED\ncode=OK"' \
            "$GITHUB_WORKSPACE/fixtures/demo-target-pr4/bundle.json" > "$RUNNER_TEMP/inj.json"

      - name: Keyid injection verification
        id: test_keyid_injection
        uses: ./
        continue-on-error: true
        with:
          bundle-path: ${{ runner.temp }}/inj.json
          public-key: ${{ github.workspace }}/fixtures/demo-target-pr4/public-key.pem
          candidate: '7cd79ab8ac46ed466a345fa6e4de315e20f6f78d'
          base: '0c484d9eaeb7afdb29d542c09094770ed6f728e6'
          repo-path: target
          require-when: always
          cairnwork-ref: '5819a8c56e19fb32d597f8213a9961f46c3307d4'

      - name: Assert keyid injection sanitized
        run: |
          # The verifier matches signatures by the keyid derived from the public key, so a
          # tampered keyid is rejected as SIGNATURE_INVALID (observed on CI); the wrapper must
          # still blank the keyid output and never emit a forged verdict line.
          test "${{ steps.test_keyid_injection.outcome }}" = "failure"
          test "${{ steps.test_keyid_injection.outputs.verdict }}" = "REJECTED"
          test "${{ steps.test_keyid_injection.outputs.code }}" = "SIGNATURE_INVALID"
          test "${{ steps.test_keyid_injection.outputs.keyid }}" = ""

      - name: Check-base exact success
        id: test_check_base_exact_success
        uses: ./
        with:
          bundle-path: ${{ github.workspace }}/fixtures/demo-target-pr4/bundle.json
          public-key: ${{ github.workspace }}/fixtures/demo-target-pr4/public-key.pem
          candidate: '7cd79ab8ac46ed466a345fa6e4de315e20f6f78d'
          base: '0c484d9eaeb7afdb29d542c09094770ed6f728e6'
          repo-path: target
          check-base: exact
          require-when: always
          cairnwork-ref: '5819a8c56e19fb32d597f8213a9961f46c3307d4'

      - name: Assert check-base exact success
        run: |
          test "${{ steps.test_check_base_exact_success.outcome }}" = "success"
          test "${{ steps.test_check_base_exact_success.outputs.verdict }}" = "VERIFIED"
          test "${{ steps.test_check_base_exact_success.outputs.code }}" = "OK"

      - name: Check-base exact failure
        id: test_check_base_exact_failure
        uses: ./
        continue-on-error: true
        with:
          bundle-path: ${{ github.workspace }}/fixtures/demo-target-pr4/bundle.json
          public-key: ${{ github.workspace }}/fixtures/demo-target-pr4/public-key.pem
          candidate: '7cd79ab8ac46ed466a345fa6e4de315e20f6f78d'
          base: '7cd79ab8ac46ed466a345fa6e4de315e20f6f78d'
          repo-path: target
          check-base: exact
          require-when: always
          cairnwork-ref: '5819a8c56e19fb32d597f8213a9961f46c3307d4'

      - name: Assert check-base exact failure
        run: |
          test "${{ steps.test_check_base_exact_failure.outcome }}" = "failure"
          test "${{ steps.test_check_base_exact_failure.outputs.code }}" = "BASE_NOT_IN_TARGET"

      - name: Copy key into repo path
        run: cp "$GITHUB_WORKSPACE/fixtures/demo-target-pr4/public-key.pem" target/pubkey-in-repo.pem

      - name: Public key inside repo-path
        id: test_public_key_inside_repo
        uses: ./
        continue-on-error: true
        with:
          bundle-path: ${{ github.workspace }}/fixtures/demo-target-pr4/bundle.json
          public-key: ${{ github.workspace }}/target/pubkey-in-repo.pem
          candidate: '7cd79ab8ac46ed466a345fa6e4de315e20f6f78d'
          base: '0c484d9eaeb7afdb29d542c09094770ed6f728e6'
          repo-path: target
          require-when: always
          cairnwork-ref: '5819a8c56e19fb32d597f8213a9961f46c3307d4'

      - name: Assert public key inside repo-path
        run: |
          test "${{ steps.test_public_key_inside_repo.outcome }}" = "failure"
          test "${{ steps.test_public_key_inside_repo.outputs.verdict }}" = "ERROR"
          test "${{ steps.test_public_key_inside_repo.outputs.code }}" = "BAD_INPUT"

      - name: Symlink key into repo path
        run: ln -s "$GITHUB_WORKSPACE/target/pubkey-in-repo.pem" "$RUNNER_TEMP/link.pem"

      - name: Public key symlink into repo-path
        id: test_public_key_symlink_into_repo
        uses: ./
        continue-on-error: true
        with:
          bundle-path: ${{ github.workspace }}/fixtures/demo-target-pr4/bundle.json
          public-key: ${{ runner.temp }}/link.pem
          candidate: '7cd79ab8ac46ed466a345fa6e4de315e20f6f78d'
          base: '0c484d9eaeb7afdb29d542c09094770ed6f728e6'
          repo-path: target
          require-when: always
          cairnwork-ref: '5819a8c56e19fb32d597f8213a9961f46c3307d4'

      - name: Assert public key symlink into repo-path
        run: |
          test "${{ steps.test_public_key_symlink_into_repo.outcome }}" = "failure"
          test "${{ steps.test_public_key_symlink_into_repo.outputs.verdict }}" = "ERROR"
          test "${{ steps.test_public_key_symlink_into_repo.outputs.code }}" = "BAD_INPUT"

      - name: Cairnwork-ref not 40-hex
        id: test_cairnwork_ref_not_40_hex
        uses: ./
        continue-on-error: true
        with:
          bundle-path: ${{ github.workspace }}/fixtures/demo-target-pr4/bundle.json
          public-key: ${{ github.workspace }}/fixtures/demo-target-pr4/public-key.pem
          candidate: '7cd79ab8ac46ed466a345fa6e4de315e20f6f78d'
          base: '0c484d9eaeb7afdb29d542c09094770ed6f728e6'
          repo-path: target
          require-when: always
          cairnwork-ref: main

      - name: Assert cairnwork-ref not 40-hex
        run: |
          test "${{ steps.test_cairnwork_ref_not_40_hex.outcome }}" = "failure"
          test "${{ steps.test_cairnwork_ref_not_40_hex.outputs.verdict }}" = "ERROR"
          test "${{ steps.test_cairnwork_ref_not_40_hex.outputs.code }}" = "BAD_INPUT"

      - name: Cairnwork-ref predates --json
        id: test_cairnwork_ref_predates_json
        uses: ./
        continue-on-error: true
        with:
          bundle-path: ${{ github.workspace }}/fixtures/demo-target-pr4/bundle.json
          public-key: ${{ github.workspace }}/fixtures/demo-target-pr4/public-key.pem
          candidate: '7cd79ab8ac46ed466a345fa6e4de315e20f6f78d'
          base: '0c484d9eaeb7afdb29d542c09094770ed6f728e6'
          repo-path: target
          require-when: always
          cairnwork-ref: '518592013c3e30e47b33d5d5ae48101335a05631'

      - name: Assert cairnwork-ref predates --json
        run: |
          test "${{ steps.test_cairnwork_ref_predates_json.outcome }}" = "failure"
          test "${{ steps.test_cairnwork_ref_predates_json.outputs.verdict }}" = "ERROR"
