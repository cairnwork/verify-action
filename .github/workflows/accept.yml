name: Cairnwork accept

# Reusable PR acceptance workflow (design v2.2): J0 gate -> J1 verify -> J2 report. A caller on the
# target repository's default branch runs it on pull_request_target and pins it by commit:
#
#   on:
#     pull_request_target:
#       types: [opened, synchronize, reopened, ready_for_review]
#   concurrency:
#     group: cairnwork-accept-${{ github.event.pull_request.number }}
#     cancel-in-progress: false
#   jobs:
#     accept:
#       uses: cairnwork/verify-action/.github/workflows/accept.yml@<40-hex>
#       with: {tests-repo: ..., ledger-repo: ..., verify-action-sha: <same 40-hex>,
#              target-branch: main, max-attempts: 3, report-app-client-id: ...,
#              ledger-verdict-pubkey: <OpenSSH public key of the verdict deploy key>}
#       secrets: {TESTS_KEY: ..., LEDGER_KEY: ..., LEDGER_VERDICT_KEY: ..., REPORT_APP_KEY: ...}
#
# Who holds what (design v2.2 section 2): J0 has no environment and no secret, only a read-only
# token, and reads API metadata of the PR. J1 (environment cairnwork-verify: tests key, ledger
# claim key) is scheduled only when J0 let the PR through; a PR from another account comes from a
# fork and J0 stops it. J2 (environment cairnwork-report: the report App key and the ledger verdict
# deploy key) never runs PR code; it reads and writes the ledger itself over SSH with the verdict
# key and creates the required check with the App's token. The report App needs checks write,
# actions read, contents read and metadata; no App permission grows for the ledger.
# A small key-check job in J2's environment, between J0 and J1, runs no PR code and tells J1 only
# whether the verdict key exists (CW_HAS_VERDICT_KEY, true/false), so J1 claims no attempt that J2
# could not judge (#35); the key itself is never named in J1's job.
#
# Verdict tags are signed by the verdict key (J2 signs every verdict commit) and J2 honours only
# verdicts whose signature verifies against that key; an unsigned or other-key verdict is not
# honoured: J2 fails the check with LEDGER_VERDICT_UNSIGNED (J1 refuses the sha as
# LEDGER_VERDICT_STRANDED). The ledger ruleset on verdict/** is defence in depth: it does
# not restrict deploy-key pushes, so the reader does the proving.
#
# With no ledger repository or no claim key, J1 stops with LEDGER_NOT_CONFIGURED before fetching anything.

on:
  workflow_call:
    inputs:
      tests-repo:
        description: "Private tests repository (owner/name); tasks/<N>/task.json and tasks/<N>/tests/"
        type: string
        required: true
      ledger-repo:
        description: "Ledger repository (owner/name, same owner as the target)"
        type: string
        required: false
        default: ''
      ledger-verdict-pubkey:
        description: "OpenSSH public key of the verdict deploy key (not a secret); J1 then honours only verdicts signed with it, as J2 does"
        type: string
        required: false
        default: ''
      verify-action-sha:
        description: "The 40-hex commit of cairnwork/verify-action the caller pins in uses:"
        type: string
        required: true
      target-branch:
        description: "The one branch accepted PRs target"
        type: string
        required: false
        default: main
      max-attempts:
        description: "Counted runs per test version (1-20)"
        type: number
        required: false
        default: 1
      min-protection:
        description: "Lowest receipt protection level a pass may have: same_process_only, partial_macos, partial, blackbox_macos or blackbox (as Cairnwork's protection.at_least reads them); a level that does not meet it, or an unknown one, fails the check"
        type: string
        required: false
        default: same_process_only
      report-app-client-id:
        description: "Client ID of the customer's report App (creates the required check)"
        type: string
        required: false
        default: ''
    secrets:
      TESTS_KEY:
        description: "Read-only deploy key of the tests repository"
        required: true
      LEDGER_KEY:
        description: "Claim deploy key of the ledger repository"
        required: false
      LEDGER_VERDICT_KEY:
        description: "Verdict deploy key of the ledger repository"
        required: false
      REPORT_APP_KEY:
        description: "Private key of the report App"
        required: false
    outputs:
      j1-result:
        description: "J1's one-line whitelisted result (schema cairnwork-accept-j1/1)"
        value: ${{ jobs.verify.outputs.result }}

permissions:
  contents: read

jobs:
  gate:
    # J0: no environment, no secret, read-only token; API metadata only, never the PR's files.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.gate.outputs.run }}
      code: ${{ steps.gate.outputs.code }}
      head-sha: ${{ steps.gate.outputs.head-sha }}
      base-sha: ${{ steps.gate.outputs.base-sha }}
      issue: ${{ steps.gate.outputs.issue }}
      pr: ${{ steps.gate.outputs.pr }}
      author: ${{ steps.gate.outputs.author }}
      target-branch: ${{ steps.gate.outputs.target-branch }}
    steps:
      - name: The verify-action commit is a 40-hex id
        env:
          CW_VERIFY_ACTION_SHA: ${{ inputs.verify-action-sha }}
        run: printf '%s' "$CW_VERIFY_ACTION_SHA" | grep -q -x -E '[0-9a-f]{40}'

      - name: Checkout verify-action scripts
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: cairnwork/verify-action
          ref: ${{ inputs.verify-action-sha }}
          path: .cw-accept
          persist-credentials: false

      - name: Gate
        id: gate
        env:
          ACCEPT_TOKEN: ${{ github.token }}
          ACCEPT_TARGET_BRANCH: ${{ inputs.target-branch }}
        run: /usr/bin/python3 -I .cw-accept/scripts/accept/j0_gate.py

  key-check:
    # J2's environment, so the verdict key is read where it already lives; no checkout, no PR code.
    # Says only whether the key exists, so J1 can stop early (LEDGER_KEY_MISSING at J1, #35)
    # without the key ever being named in its job. A required reviewer on cairnwork-report would
    # now be asked before J1 instead of before J2.
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: cairnwork-report
    permissions:
      contents: read
    outputs:
      has-verdict-key: ${{ steps.key.outputs.has-verdict-key }}
    steps:
      - name: Whether the verdict key exists (true or false; the key itself stays here)
        id: key
        env:
          HAS: ${{ secrets.LEDGER_VERDICT_KEY != '' }}
        run: printf 'has-verdict-key=%s\n' "$HAS" >> "$GITHUB_OUTPUT"

  verify:
    # J1. Every value from J0 reaches the scripts through env and is format-checked there; nothing
    # is expanded into a run: line. From the first contact with the tests repository on, all
    # output goes to owner-only files under CW_PRIVATE; the only public output is the checked
    # result line of the last step.
    needs: [gate, key-check]
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    environment: cairnwork-verify
    permissions:
      contents: read
    outputs:
      result: ${{ steps.result.outputs.result }}
    env:
      # Cairnwork main, pinned: its bwrap policy, verifier account and verify engine.
      CW_CAIRNWORK_REF: 36b569240b896878c23153927c27781755af9e3c
    steps:
      - name: Runner self-check; the verify-action commit is a 40-hex id
        env:
          CW_VERIFY_ACTION_SHA: ${{ inputs.verify-action-sha }}
        run: |
          test "$RUNNER_ENVIRONMENT" = "github-hosted"
          # a branch or tag name would run moving scripts: refuse anything but a commit id
          printf '%s' "$CW_VERIFY_ACTION_SHA" | grep -q -x -E '[0-9a-f]{40}'

      - name: Checkout verify-action scripts
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: cairnwork/verify-action
          ref: ${{ inputs.verify-action-sha }}
          path: .cw-accept
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6 (commit)
        with:
          enable-cache: false

      - name: Host setup (output to the private log)
        env:
          CW_PRIVATE: ${{ runner.temp }}/cw-j1
        run: sh .cw-accept/scripts/accept/j1_host.sh

      - name: Verify (output to the private log)
        env:
          CW_PRIVATE: ${{ runner.temp }}/cw-j1
          CW_HEAD_SHA: ${{ needs.gate.outputs.head-sha }}
          CW_BASE_SHA: ${{ needs.gate.outputs.base-sha }}
          CW_ISSUE: ${{ needs.gate.outputs.issue }}
          CW_PR: ${{ needs.gate.outputs.pr }}
          CW_AUTHOR: ${{ needs.gate.outputs.author }}
          CW_TARGET_BRANCH: ${{ needs.gate.outputs.target-branch }}
          CW_TARGET_REPO: ${{ github.repository }}
          CW_TESTS_REPO: ${{ inputs.tests-repo }}
          CW_LEDGER_REPO: ${{ inputs.ledger-repo }}
          CW_LEDGER_VERDICT_PUBKEY: ${{ inputs.ledger-verdict-pubkey }}
          CW_RUN_ID: ${{ github.run_id }}
          CW_RUN_ATTEMPT: ${{ github.run_attempt }}
          CW_TARGET_REPO_ID: ${{ github.repository_id }}
          CW_MAX_ATTEMPTS: ${{ inputs.max-attempts }}
          CW_MIN_PROTECTION: ${{ inputs.min-protection }}  # enforced by J2 at the reader
          CW_TESTS_KEY: ${{ secrets.TESTS_KEY }}
          CW_LEDGER_KEY: ${{ secrets.LEDGER_KEY }}
          # true/false from the key-check job: with false J1 claims no attempt (#35)
          CW_HAS_VERDICT_KEY: ${{ needs.key-check.outputs.has-verdict-key }}
          CW_TARGET_TOKEN: ${{ github.token }}
        run: |
          umask 077
          CW_UV="$(command -v uv)" CW_CAIRNWORK_BIN="$CW_PRIVATE/cw-src/.venv/bin" \
            "$CW_PRIVATE/cw-src/.venv/bin/python" -I .cw-accept/scripts/accept/j1_verify.py \
            >>"$CW_PRIVATE/j1.log" 2>&1

      - name: Result
        id: result
        if: always()
        env:
          CW_PRIVATE: ${{ runner.temp }}/cw-j1
        run: /usr/bin/python3 -I .cw-accept/scripts/accept/j1_emit.py "$CW_PRIVATE"

  report:
    # J2: runs whatever J0 and J1 did; never runs PR code. Reads the ledger with the verdict key,
    # writes the verdict, reads again and creates the required check (success or failure only).
    needs: [gate, verify]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: cairnwork-report
    permissions:
      contents: read
    steps:
      - name: Runner self-check; inputs have their shapes
        id: names
        env:
          CW_VERIFY_ACTION_SHA: ${{ inputs.verify-action-sha }}
          CW_LEDGER_REPO: ${{ inputs.ledger-repo }}
          CW_OWNER: ${{ github.repository_owner }}
          CW_MIN_PROTECTION: ${{ inputs.min-protection }}
        run: |
          test "$RUNNER_ENVIRONMENT" = "github-hosted"
          printf '%s' "$CW_MIN_PROTECTION" | grep -q -x -E 'same_process_only|partial_macos|blackbox_macos|partial|blackbox'
          printf '%s' "$CW_VERIFY_ACTION_SHA" | grep -q -x -E '[0-9a-f]{40}'
          if [ -n "$CW_LEDGER_REPO" ]; then
            printf '%s' "$CW_LEDGER_REPO" | grep -q -x -E '[A-Za-z0-9][A-Za-z0-9-]{0,38}/[A-Za-z0-9._-]{1,100}'
            test "${CW_LEDGER_REPO%%/*}" = "$CW_OWNER"  # one App installation: same owner
            echo "ledger-name=${CW_LEDGER_REPO#*/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout verify-action scripts
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: cairnwork/verify-action
          ref: ${{ inputs.verify-action-sha }}
          path: .cw-accept
          persist-credentials: false

      - name: App token for the target repository (check runs, job state)
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ inputs.report-app-client-id }}
          private-key: ${{ secrets.REPORT_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-checks: write
          permission-actions: read

      - name: Report
        env:
          ACCEPT_TARGET_REPO: ${{ github.repository }}
          ACCEPT_TARGET_REPO_ID: ${{ github.repository_id }}
          ACCEPT_SHA: ${{ needs.gate.outputs.head-sha }}
          ACCEPT_RUN_ID: ${{ github.run_id }}
          ACCEPT_J0_CODE: ${{ needs.gate.outputs.code }}
          ACCEPT_PR_ISSUE: ${{ needs.gate.outputs.issue }}
          ACCEPT_J1_JOB_RESULT: ${{ needs.verify.result }}
          ACCEPT_J1_RESULT: ${{ needs.verify.outputs.result }}
          ACCEPT_J1_JOB_NAME: verify
          ACCEPT_LEDGER_URL: ${{ inputs.ledger-repo != '' && format('git@github.com:{0}.git', inputs.ledger-repo) || '' }}  # SSH form only; without the key J2 stops: LEDGER_KEY_MISSING, no check
          ACCEPT_MIN_PROTECTION: ${{ inputs.min-protection }}
          ACCEPT_MAX_ATTEMPTS: ${{ inputs.max-attempts }}
          ACCEPT_CHECK_NAME: cairnwork-accept
          ACCEPT_NOTE_CHECK_NAME: cairnwork-accept-note
          ACCEPT_APP_TOKEN: ${{ steps.app.outputs.token }}
          ACCEPT_LEDGER_KEY: ${{ secrets.LEDGER_VERDICT_KEY }}
        run: /usr/bin/python3 -I .cw-accept/scripts/accept/j2_report.py
